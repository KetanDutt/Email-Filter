name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Confirm vendored assets exist
        run: test -s vendor/bootstrap.min.css && test -s vendor/bootstrap-icons/fonts/bootstrap-icons.woff2
